name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test helpers and skill package
        run: python -m unittest discover -s tests -v
      - name: Validate synthetic campaign
        run: python skills/ai-client-hunter/scripts/prepare_campaign.py check --campaign skills/ai-client-hunter/assets/synthetic-campaign --check-only
      - name: Export synthetic artifacts
        run: python skills/ai-client-hunter/scripts/export_campaign.py --campaign skills/ai-client-hunter/assets/synthetic-campaign --out outputs/synthetic
      - name: Validate decision-maker campaign
        run: python skills/ai-client-hunter/scripts/prepare_campaign.py check --campaign skills/ai-client-hunter/assets/decision-maker-campaign --check-only
      - name: Export decision-maker artifacts
        run: python skills/ai-client-hunter/scripts/export_campaign.py --campaign skills/ai-client-hunter/assets/decision-maker-campaign --out outputs/decision-makers
